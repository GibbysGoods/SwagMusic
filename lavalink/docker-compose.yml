services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:latest
    container_name: discord-music-lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1G
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - ./youtube-plugin.jar:/opt/Lavalink/plugins/youtube-plugin.jar:ro
    ports:
      - "2333:2333"
