services:
  postgres:
    image: postgres:18
    container_name: discord-music-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-musicbot}
      POSTGRES_USER: ${DB_USER:-musicbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: discord-music-bot:local
    container_name: discord-music-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LAVALINK_HOST: lavalink
      BOT_API_HOST: 0.0.0.0

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: discord-music-api:local
    container_name: discord-music-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      BOT_API_URL: http://bot:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?DISCORD_GUILD_ID must be set in .env}
    image: discord-music-web:local
    container_name: discord-music-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:latest
    container_name: discord-music-lavalink
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: -Xmx1G
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?LAVALINK_PASSWORD must be set in .env}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/youtube-plugin.jar:/opt/Lavalink/plugins/youtube-plugin.jar:ro
    expose:
      - "2333"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: $${LAVALINK_PASSWORD}\" http://localhost:2333/version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
    name: discord-music-bot_postgres_data