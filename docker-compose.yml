services:
  postgres:
    image: postgres:18
    container_name: discord-music-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: musicbot
      POSTGRES_USER: musicbot
      POSTGRES_PASSWORD: musicbot-dev-password
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  postgres_data: